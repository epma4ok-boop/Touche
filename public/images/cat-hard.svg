<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='675' viewBox='0 0 1200 675'>
  <defs>
    <radialGradient id='bg' cx='65%' cy='45%' r='75%'>
      <stop offset='0%' stop-color='#1a0810'/>
      <stop offset='60%' stop-color='#0e0408'/>
      <stop offset='100%' stop-color='#060204'/>
    </radialGradient>
    <radialGradient id='spot' cx='70%' cy='40%' r='45%'>
      <stop offset='0%' stop-color='#3d1520' stop-opacity='0.8'/>
      <stop offset='100%' stop-color='#3d1520' stop-opacity='0'/>
    </radialGradient>
    <filter id='blur'><feGaussianBlur stdDeviation='22'/></filter>
    <filter id='blur2'><feGaussianBlur stdDeviation='8'/></filter>
    <pattern id='leather' x='0' y='0' width='40' height='40' patternUnits='userSpaceOnUse'>
      <rect width='40' height='40' fill='none'/>
      <circle cx='20' cy='20' r='18' fill='none' stroke='#1f0a0f' stroke-width='1' opacity='0.4'/>
      <circle cx='0' cy='0' r='18' fill='none' stroke='#1f0a0f' stroke-width='1' opacity='0.4'/>
      <circle cx='40' cy='0' r='18' fill='none' stroke='#1f0a0f' stroke-width='1' opacity='0.4'/>
      <circle cx='0' cy='40' r='18' fill='none' stroke='#1f0a0f' stroke-width='1' opacity='0.4'/>
      <circle cx='40' cy='40' r='18' fill='none' stroke='#1f0a0f' stroke-width='1' opacity='0.4'/>
    </pattern>
  </defs>
  <rect width='1200' height='675' fill='url(#bg)'/>
  <rect width='1200' height='675' fill='url(#leather)' opacity='0.5'/>
  <rect width='1200' height='675' fill='url(#spot)'/>
  <!-- Leather strap shape -->
  <rect x='550' y='280' width='560' height='115' rx='12' fill='#1a0810' stroke='#2e1018' stroke-width='2'/>
  <rect x='560' y='292' width='540' height='91' rx='8' fill='#150608' opacity='0.8' filter='url(#blur2)'/>
  <!-- Buckle -->
  <rect x='620' y='300' width='60' height='98' rx='6' fill='#2a2a2a'/>
  <rect x='628' y='308' width='44' height='82' rx='4' fill='#1a1a1a'/>
  <rect x='646' y='295' width='8' height='110' rx='4' fill='#888888' opacity='0.8'/>
  <!-- Metal gleam -->
  <ellipse cx='650' cy='320' rx='6' ry='20' fill='white' opacity='0.15' filter='url(#blur2)'/>
  <!-- Side glow pink -->
  <ellipse cx='1100' cy='337' rx='200' ry='100' fill='#dc1464' opacity='0.12' filter='url(#blur)'/>
  <linearGradient id='lgrad' x1='0' y1='0' x2='1' y2='0'>
    <stop offset='0%' stop-color='#060204' stop-opacity='1'/>
    <stop offset='45%' stop-color='#060204' stop-opacity='0.65'/>
    <stop offset='100%' stop-color='#060204' stop-opacity='0.1'/>
  </linearGradient>
  <rect width='1200' height='675' fill='url(#lgrad)'/>
</svg>