<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='675' viewBox='0 0 1200 675'>
  <defs>
    <radialGradient id='bg' cx='65%' cy='40%' r='80%'>
      <stop offset='0%' stop-color='#1e0820'/>
      <stop offset='50%' stop-color='#0e0415'/>
      <stop offset='100%' stop-color='#06020d'/>
    </radialGradient>
    <radialGradient id='glow1' cx='65%' cy='30%' r='40%'>
      <stop offset='0%' stop-color='#dc1464' stop-opacity='0.30'/>
      <stop offset='100%' stop-color='#dc1464' stop-opacity='0'/>
    </radialGradient>
    <radialGradient id='glow2' cx='80%' cy='60%' r='35%'>
      <stop offset='0%' stop-color='#9b1bb5' stop-opacity='0.25'/>
      <stop offset='100%' stop-color='#9b1bb5' stop-opacity='0'/>
    </radialGradient>
    <filter id='blur'><feGaussianBlur stdDeviation='28'/></filter>
    <filter id='blur2'><feGaussianBlur stdDeviation='6'/></filter>
    <filter id='blur3'><feGaussianBlur stdDeviation='2'/></filter>
  </defs>
  <rect width='1200' height='675' fill='url(#bg)'/>
  <rect width='1200' height='675' fill='url(#glow1)'/>
  <rect width='1200' height='675' fill='url(#glow2)'/>
  <!-- Bokeh circles -->
  <circle cx='800' cy='120' r='35' fill='#dc1464' opacity='0.18' filter='url(#blur)'/>
  <circle cx='950' cy='200' r='22' fill='#ff4488' opacity='0.20' filter='url(#blur)'/>
  <circle cx='1050' cy='80' r='18' fill='#cc2288' opacity='0.25' filter='url(#blur)'/>
  <circle cx='750' cy='500' r='28' fill='#9b20cc' opacity='0.18' filter='url(#blur)'/>
  <circle cx='1100' cy='400' r='40' fill='#dc1464' opacity='0.12' filter='url(#blur)'/>
  <circle cx='870' cy='350' r='15' fill='#ff6699' opacity='0.22' filter='url(#blur)'/>
  <!-- Glass left -->
  <path d='M 730 180 L 800 380 L 760 380 L 760 460 L 840 460 L 840 380 L 800 380' fill='none' stroke='rgba(255,180,210,0.35)' stroke-width='2.5' filter='url(#blur3)'/>
  <path d='M 730 180 Q 800 320 870 180 Z' fill='rgba(220,50,130,0.12)' stroke='rgba(255,180,210,0.30)' stroke-width='2'/>
  <!-- Glass right -->
  <path d='M 870 180 L 940 380 L 900 380 L 900 460 L 980 460 L 980 380 L 940 380' fill='none' stroke='rgba(255,180,210,0.35)' stroke-width='2.5' filter='url(#blur3)'/>
  <path d='M 870 180 Q 940 320 1010 180 Z' fill='rgba(220,50,130,0.12)' stroke='rgba(255,180,210,0.30)' stroke-width='2'/>
  <!-- Clink lines -->
  <line x1='868' y1='178' x2='820' y2='150' stroke='rgba(255,200,220,0.55)' stroke-width='2' filter='url(#blur3)'/>
  <line x1='872' y1='175' x2='900' y2='148' stroke='rgba(255,200,220,0.55)' stroke-width='2' filter='url(#blur3)'/>
  <!-- Bubbles -->
  <circle cx='780' cy='300' r='3' fill='rgba(255,180,210,0.55)'/>
  <circle cx='800' cy='250' r='2' fill='rgba(255,180,210,0.45)'/>
  <circle cx='790' cy='220' r='2.5' fill='rgba(255,180,210,0.40)'/>
  <circle cx='920' cy='290' r='3' fill='rgba(255,180,210,0.50)'/>
  <circle cx='940' cy='240' r='2' fill='rgba(255,180,210,0.45)'/>
  <!-- Sparkles -->
  <circle cx='868' cy='175' r='4' fill='white' opacity='0.7' filter='url(#blur3)'/>
  <line x1='860' y1='175' x2='876' y2='175' stroke='white' stroke-width='1.5' opacity='0.6'/>
  <line x1='868' y1='167' x2='868' y2='183' stroke='white' stroke-width='1.5' opacity='0.6'/>
  <linearGradient id='lgrad' x1='0' y1='0' x2='1' y2='0'>
    <stop offset='0%' stop-color='#06020d' stop-opacity='1'/>
    <stop offset='42%' stop-color='#06020d' stop-opacity='0.65'/>
    <stop offset='100%' stop-color='#06020d' stop-opacity='0.08'/>
