<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='675' viewBox='0 0 1200 675'>
  <defs>
    <radialGradient id='bg' cx='60%' cy='40%' r='80%'>
      <stop offset='0%' stop-color='#5c0018'/>
      <stop offset='40%' stop-color='#2d000c'/>
      <stop offset='100%' stop-color='#0d0006'/>
    </radialGradient>
    <radialGradient id='s1' cx='50%' cy='50%' r='60%'>
      <stop offset='0%' stop-color='#9b0030' stop-opacity='0.7'/>
      <stop offset='100%' stop-color='#9b0030' stop-opacity='0'/>
    </radialGradient>
    <radialGradient id='s2' cx='80%' cy='30%' r='50%'>
      <stop offset='0%' stop-color='#cc1144' stop-opacity='0.5'/>
      <stop offset='100%' stop-color='#cc1144' stop-opacity='0'/>
    </radialGradient>
    <filter id='blur1'><feGaussianBlur stdDeviation='30'/></filter>
    <filter id='blur2'><feGaussianBlur stdDeviation='18'/></filter>
  </defs>
  <rect width='1200' height='675' fill='url(#bg)'/>
  <!-- Silk wave folds -->
  <ellipse cx='700' cy='200' rx='400' ry='180' fill='#7a0020' opacity='0.45' filter='url(#blur1)'/>
  <ellipse cx='900' cy='450' rx='350' ry='200' fill='#aa0035' opacity='0.35' filter='url(#blur1)'/>
  <ellipse cx='500' cy='350' rx='300' ry='150' fill='#660018' opacity='0.40' filter='url(#blur2)'/>
  <!-- Highlight fold -->
  <path d='M 600 50 Q 900 200 1100 100 Q 950 350 1100 500 Q 800 600 900 675' stroke='#dd2244' stroke-width='3' fill='none' opacity='0.25' filter='url(#blur2)'/>
  <path d='M 400 0 Q 750 150 1000 80 Q 850 300 1050 420' stroke='#ff3366' stroke-width='2' fill='none' opacity='0.18' filter='url(#blur2)'/>
  <rect width='1200' height='675' fill='url(#s1)' opacity='0.6'/>
  <rect width='1200' height='675' fill='url(#s2)' opacity='0.5'/>
  <!-- Left dark overlay so text is readable -->
  <linearGradient id='lgrad' x1='0' y1='0' x2='1' y2='0'>
    <stop offset='0%' stop-color='#0d0006' stop-opacity='1'/>
    <stop offset='50%' stop-color='#0d0006' stop-opacity='0.6'/>
    <stop offset='100%' stop-color='#0d0006' stop-opacity='0.1'/>
  </linearGradient>
  <rect width='1200' height='675' fill='url(#lgrad)'/>
</svg>